<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brother Muckers</title>
  <meta name="description" content="Brother Muckers — Getting dirty, moving earth, and getting the job done." />

  <style>
    :root {
      --bg-color: #121413;
      --card-bg: #1c201e;
      --border-color: #2e3632;
      --text-main: #e8ebe9;
      --text-muted: #9faaa3;
      --accent: #d97736;
      --accent-hover: #b86026;
      --accent-glow: rgba(217, 119, 54, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .container {
      max-width: 580px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(217, 119, 54, 0.3);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    p.lead {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      max-width: 320px;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .cta-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .cta-button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <span class="badge">Official Landing Page</span>
    <h1>Brother Muckers</h1>
    <p class="lead">
      Deep underground, knee-deep in mud, and pushing through the squeeze. Stay up to date with our digs, expeditions, and projects.
    </p>

    <a 
      href="https://m.facebook.com/BrotherMuckers/" 
      class="cta-button" 
      target="_blank" 
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      Follow on Facebook
    </a>
  </main>

  <footer>
    &copy; Brother Muckers &bull; brothermuckers.com
  </footer>

</body>
</html>
